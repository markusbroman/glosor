<!DOCTYPE html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><title>Glosspelet – Kapitel 3</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#eef2ff;--bg2:#fdf2f8;--card:#ffffffcc;--ink:#1e1b3a;--mute:#6b6a85;--a:#6366f1;--a2:#8b5cf6;--b:#f97316;--b2:#fb923c;--ok:#10b981;--bad:#f43f5e;--line:#e3e4f3;--sh:0 8px 24px rgba(79,70,229,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#12122b;--bg2:#241338;--card:#25254acc;--ink:#f1f0ff;--mute:#a3a2c4;--line:#3a3a66;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg1:#12122b;--bg2:#241338;--card:#25254acc;--ink:#f1f0ff;--mute:#a3a2c4;--line:#3a3a66;--sh:0 8px 24px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:20px 16px 32px;text-align:center}
h1{font-size:30px;font-weight:900;margin:18px 0 4px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--a),var(--a2),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-weight:600;margin-bottom:18px}
.btn{display:block;width:100%;margin:12px 0;padding:18px;border:0;border-radius:20px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font:800 18px "Nunito",system-ui,sans-serif;cursor:pointer;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.btn.o{background:linear-gradient(135deg,var(--b),#f43f5e)}
.btn.g{background:linear-gradient(135deg,#10b981,#06b6d4)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px;color:var(--mute)}
.top span:first-child{background:var(--card);padding:6px 12px;border-radius:99px;color:var(--ink);box-shadow:var(--sh)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px;transition:width .4s}
.q{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:28px;padding:26px 20px;margin:10px 0 18px;box-shadow:var(--sh);animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.big{font-size:64px;line-height:1.1;margin-bottom:6px}
.word{font-size:26px;font-weight:900}
.opt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-size:17px;font-weight:700;padding:16px;backdrop-filter:blur(10px)}
.opt:hover{border-color:var(--a)}
.right{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important;animation:pop .3s}
.wrong{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .btn{margin:0;font-size:15px;padding:12px 8px;min-height:68px;border-radius:18px}
.sel{outline:3px solid var(--a);outline-offset:2px;transform:scale(1.03)}
.done{opacity:.4;pointer-events:none}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px 0}
.slot{width:36px;height:46px;border-bottom:4px solid var(--a);font-size:28px;font-weight:900;color:var(--a)}
.gap{width:16px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:8px}
.tile{width:50px;height:54px;border:0;border-radius:14px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);font:900 24px "Nunito",system-ui,sans-serif;box-shadow:var(--sh);cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.9)}
.tile:disabled{opacity:.2;box-shadow:none}
.speak{background:var(--bg1);border:0;border-radius:99px;width:48px;height:48px;font-size:24px;cursor:pointer;margin-top:8px}
.shake{animation:s .35s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{min-height:30px;font-weight:800;font-size:17px;margin:6px 0}
.stars{font-size:52px;margin:10px 0;animation:pop .5s}
</style></head><body><div id="app"></div>
<script>
// ===== LÄGG TILL NYA ORD HÄR (sv, en, emoji) =====
const WORDS=[
{sv:"Stegvis",en:"step by step",e:"🪜"},
{sv:"För det första",en:"first",e:"1️⃣"},
{sv:"För det andra",en:"second",e:"2️⃣"},
{sv:"Därefter",en:"then",e:"➡️"},
{sv:"Sedan",en:"next",e:"⏭️"},
{sv:"En lista med vad du behöver",en:"a list of what you need",e:"📝"},
{sv:"Beroende på",en:"depending on",e:"🤔"}
];
const $=document.getElementById('app');
let score=0,round=0,total=0,mistakes=0;
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function menu(){
 score=0;
 $.innerHTML=`<div style="font-size:54px">🌟</div><h1>Glosspelet</h1><div class="sub">Kapitel 3 · ${WORDS.length} ord</div>
 <button class="btn" onclick="match()">🧩 Para ihop</button>
 <button class="btn o" onclick="choice('sv')">🇸🇪➡️🇬🇧 Svenska till engelska</button>
 <button class="btn g" onclick="choice('en')">🇬🇧➡️🇸🇪 Engelska till svenska</button>
 <button class="btn" onclick="spell()">🔤 Stava rätt</button>`;
}
function end(){
 const pct=total?Math.max(0,1-mistakes/(total+mistakes)):1;
 const s=pct>.85?3:pct>.6?2:1;
 $.innerHTML=`<h1>Bra jobbat! 🎉</h1><div class="stars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div>
 <div class="q"><div class="word">${score} poäng</div><div class="sub">${mistakes} misstag</div></div>
 <button class="btn" onclick="menu()">🏠 Till menyn</button>`;
}
function head(){return `<div class="top"><span>⭐ ${score}</span><span>${round+1}/${total}</span><span onclick="menu()" style="cursor:pointer">🏠</span></div><div class="bar"><i style="width:${round/total*100}%"></i></div>`}

// --- Para ihop ---
function match(){
 mistakes=0;score=0;const set=shuf(WORDS).slice(0,6);total=set.length;let left=total,sel=null;
 const L=shuf(set.map(w=>({t:w.sv,k:w.sv,l:'sv'}))),R=shuf(set.map(w=>({t:w.en,k:w.sv,l:'en'})));
 $.innerHTML=`<div class="top"><span>⭐ <b id="sc">0</b></span><span>Tryck på orden som hör ihop</span><span onclick="menu()" style="cursor:pointer">🏠</span></div>
 <div class="grid" id="g"></div><div class="msg" id="m"></div>`;
 const g=document.getElementById('g');
 L.forEach((x,i)=>{g.append(mk(x),mk(R[i]))});
 function mk(x){const b=document.createElement('button');b.className='btn opt';b.textContent=x.t;
  b.onclick=()=>{
   if(x.l==='en')say(x.t);
   if(!sel){sel={x,b};b.classList.add('sel');return}
   if(sel.b===b){b.classList.remove('sel');sel=null;return}
   if(sel.x.l===x.l){sel.b.classList.remove('sel');sel={x,b};b.classList.add('sel');return}
   if(sel.x.k===x.k){[sel.b,b].forEach(e=>{e.classList.remove('sel');e.classList.add('right','done')});score+=10;left--;
    document.getElementById('sc').textContent=score;document.getElementById('m').textContent='✅ Rätt!';sel=null;if(!left)setTimeout(end,700)}
   else{mistakes++;const a=sel.b;[a,b].forEach(e=>e.classList.add('wrong'));setTimeout(()=>{[a,b].forEach(e=>e.classList.remove('wrong','sel'))},450);sel=null;document.getElementById('m').textContent='Oj, försök igen!'}
  };return b}
}

// --- Flerval ---
function choice(dir){
 mistakes=0;score=0;round=0;const qs=shuf(WORDS);total=qs.length;ask();
 function ask(){
  const w=qs[round],from=dir==='sv'?'sv':'en',to=dir==='sv'?'en':'sv';
  const opts=shuf([w,...shuf(WORDS.filter(x=>x!==w)).slice(0,3)]);
  $.innerHTML=head()+`<div class="q"><div class="big">${w.e}</div><div class="word">${w[from]}</div>${dir==='en'?`<button class="speak" onclick="say('${w.en}')">🔊</button>`:''}</div><div id="o"></div><div class="msg" id="m"></div>`;
  if(dir==='en')say(w.en);
  opts.forEach(o=>{const b=document.createElement('button');b.className='btn opt';b.textContent=o[to];
   b.onclick=()=>{if(o===w){b.classList.add('right');score+=10;document.getElementById('m').textContent='✅ Rätt!';say(w.en);
     document.querySelectorAll('#o .btn').forEach(x=>x.style.pointerEvents='none');
     setTimeout(()=>{round++;round<total?ask():end()},900)}
    else{mistakes++;b.classList.add('wrong');b.style.pointerEvents='none';document.getElementById('m').textContent='Försök igen!'}};
   document.getElementById('o').append(b)});
 }
}

// --- Stava rätt ---
function spell(){
 mistakes=0;score=0;round=0;const qs=shuf(WORDS);total=qs.length;ask();
 function ask(){
  const w=qs[round],letters=w.en.replace(/ /g,'').split(''),cur=[],used=[];
  const order=shuf(letters.map((c,i)=>i));
  $.innerHTML=head()+`<div class="q"><div class="big">${w.e}</div><div class="word">${w.sv}</div><div class="sub">Stava på engelska</div></div>
  <div class="slots" id="s"></div><div class="tiles" id="t"></div><div class="msg" id="m"></div>
  <button class="btn o" id="bk">⌫ Ta bort</button>`;
  const draw=()=>{let k=0;document.getElementById('s').innerHTML=[...w.en].map(c=>c===' '?'<div class="gap"></div>':`<div class="slot">${(cur[k++]!==undefined?letters[cur[k-1]]:'')}</div>`).join('');
   document.querySelectorAll('.tile').forEach(t=>t.disabled=cur.includes(+t.dataset.i))};
  order.forEach(i=>{const b=document.createElement('button');b.className='tile';b.textContent=letters[i];b.dataset.i=i;
   b.onclick=()=>{cur.push(i);draw();if(cur.length===letters.length)check()};document.getElementById('t').append(b)});
  document.getElementById('bk').onclick=()=>{cur.pop();draw()};
  function check(){
   if(cur.map(i=>letters[i]).join('')===letters.join('')){score+=10;document.getElementById('m').textContent='🎉 Rätt stavat!';say(w.en);
    setTimeout(()=>{round++;round<total?ask():end()},1100)}
   else{mistakes++;const s=document.getElementById('s');s.classList.add('shake');document.getElementById('m').textContent='Nästan! Försök igen.';
    setTimeout(()=>{s.classList.remove('shake');cur.length=0;draw()},500)}
  }
  draw();
 }
}
menu();
</script></body></html>
